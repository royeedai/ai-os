version: 2
baseline_id: "BL-20260321-153000-state-transition-rebuild"
scope:
  mode: "brownfield"
  focus: "benefit-deduction-state-machine"
  baseline_source: "MISSION.md + specs/"
  change_control: "all requirement changes must go through /change-request"
  quality_tier: "high-risk"
  primary_spec: "specs/state-transition.spec.md"
  confirmed_stack_decisions: "existing account-service + database transactions + audit log table"
  target_runtime: "正式账户服务 + 正式鉴权 + 数据库迁移窗口"
  dev_fallback: "staging data + replayable mock requests for dry-run verification"

required_special_reviews:
  - "security-guard"
  - "authorization-boundary-check"
  - "concurrency-safety-check"

gates:
  - id: "design-confirmation"
    title: "设计确认门"
    status: passed
    checks:
      - "MISSION.md 已是本轮最新且已确认的需求基准"
      - "acceptance.yaml / tasks.yaml / Mission 的 baseline_id 一致"
      - "关键页面、状态流转和审计信息架构已确认"
      - "高风险审批点已显式列出"
    evidence:
      - "design-decision-log"
      - "ia-map"
      - "screen-reference"

  - id: "logic-confirmation"
    title: "逻辑确认门"
    status: in_progress
    checks:
      - "核心接口、状态流转和补偿规则已确认"
      - "关键异常路径和边界条件已确认"
      - "baseline-log/ 已留下本轮基线确认记录文件"
      - "spec 与 Mission / Design 没有冲突"
    evidence:
      - "spec-review"
      - "contract-note"
      - "state-flow-note"

  - id: "implementation-quality"
    title: "实现质量门"
    status: pending
    checks:
      - "核心实现完成"
      - "契约基准、字段映射和状态枚举与实现一致"
      - "项目原生静态校验已完成"
      - "测试与 review 已通过"
    evidence:
      - "build-log"
      - "test-log"
      - "static-validation-check"
      - "task-flow-check"
      - "review-report"
      - "contract-baseline-check"

  - id: "delivery-readiness"
    title: "交付质量门"
    status: pending
    checks:
      - "运行态验证已完成"
      - "关键异常 / 权限 / 并发路径证据已记录"
      - "交付说明已区分 AI 已完成 与 需人工执行"
      - "fallback 证据未被误当成正式交付证据"
    evidence:
      - "runtime-check"
      - "uat-result"
      - "manual-action-note"
      - "handoff-note"
      - "rollback-note"
      - "degraded-path-check"

  - id: "parity-gate"
    title: "对照一致性门"
    status: not_applicable
    checks:
      - "本项目不是 reverse-spec，对照一致性门不适用"
    evidence:
      - "behavior-note"

result:
  design_locked: passed
  logic_locked: in_progress
  implementation_ready: blocked
  delivery_ready: blocked
  blockers:
    - "等待并发冲突策略确认"
  advisories: []
  user_confirmation_blockers:
    - "并发冲突策略"
    - "发布窗口顺序"
