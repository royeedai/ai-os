version: 2
baseline_id: "BL-20260316-090000-guided-product-baseline"
scope:
  mode: "greenfield"
  focus: "homepage-and-main-flow"
  baseline_source: "MISSION.md + specs/"
  change_control: "all requirement changes must go through /change-request"
  quality_tier: "standard"

required_special_reviews: []

gates:
  - id: design-confirmation
    title: "设计确认门"
    status: pending
    checks:
      - "MISSION.md 已是本轮最新且已确认的需求基准"
      - "acceptance.yaml / tasks.yaml / Mission 的 baseline_id 一致"
      - "关键页面、信息架构和关键交互已确认"
      - "关键视觉方向和不采用的风格已写清"
    evidence:
      - "design-decision-log"
      - "ia-map"

  - id: logic-confirmation
    title: "逻辑确认门"
    status: pending
    checks:
      - "核心接口、状态流转和业务规则已确认"
      - "关键异常路径和边界条件已确认"
      - "baseline-log 已留下本轮基线确认记录"
    evidence:
      - "spec-review"
      - "contract-note"

  - id: implementation-quality
    title: "实现质量门"
    status: pending
    checks:
      - "核心实现完成"
      - "契约基准与实现一致"
      - "修改边界符合确认方案"
    evidence:
      - "build-log"
      - "test-log"

  - id: delivery-readiness
    title: "交付质量门"
    status: pending
    checks:
      - "运行态验证已完成"
      - "交付说明齐全"
    evidence:
      - "runtime-check"
      - "handoff-note"

  - id: parity-gate
    title: "对照一致性门"
    status: not_applicable
    checks:
      - "reverse-spec 项目已给出对照证据"
    evidence:
      - "screenshot-compare"

result:
  design_locked: blocked
  logic_locked: blocked
  implementation_ready: blocked
  delivery_ready: blocked
  blockers: []
