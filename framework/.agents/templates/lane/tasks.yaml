# 本模板所有内容必须严格基于用户确认的需求基准生成，禁止擅自超出范围、脑补内容。
version: 3
baseline_id: "{{INITIAL_BASELINE_ID}}"
scope:
  mode: "change"
  focus: "example-lane"
  baseline_source: "lane MISSION.md + specs/"
  quality_tier: "standard"

milestones:
  - id: M1
    title: "Design Locked"
    goal: "关键设计与逻辑已确认"
    scope: "[本里程碑覆盖范围]"
    acceptance_goal: "[本里程碑通过标准]"
    target_window: "[计划时间窗口]"
  - id: M2
    title: "Built and Verified"
    goal: "实现、验证和交付证据已就绪"
    scope: "[本里程碑覆盖范围]"
    acceptance_goal: "[本里程碑通过标准]"
    target_window: "[计划时间窗口]"

tasks:
  - id: TASK-AI-001
    title: "收敛当前 lane 的关键设计与契约"
    milestone: M1
    status: todo
    owner: AI
    priority: P1
    wave: 1
    approval_required: false  # 布尔；high-risk 任务设 true 触发审批门（doctor W074）
    depends_on: []
    requirement_refs:
      - "REQ-001"
    acceptance_refs:
      - "AC-001"
    handoff_to: "[AI / human / external-agent]"
    context_refs:
      - ".ai-os/lanes/default/MISSION.md"
      - ".ai-os/lanes/default/DESIGN.md"
      - ".ai-os/lanes/default/specs/example.spec.md"
    expected_return:
      - "[design note / spec delta / review note]"
    agent_run_review:
      execution_surface: "[local_foreground / cloud_background / external_pr_agent / human]"
      run_refs: []
      write_scope:
        owned:
          - "[file or module owned by this run]"
        out_of_scope:
          - "[file or module explicitly not owned]"
      progress_checkpoints:
        - "[plan accepted / diff produced / tests run / blocker surfaced / review requested]"
      return_packet:
        summary: "[what came back from the long-horizon run]"
        changed_files: []
        tests: []
        unresolved_risks: []
        follow_up_needed: []
      human_review_status: "pending"
    fact_state_review:
      observed:
        - "[code / docs / runtime evidence actually inspected]"
      confirmed:
        - "[user-confirmed or artifact-confirmed fact]"
      inferred: []
      unknown: []
    impact_tags:
      - "entrypoint"
      - "schema"
    evidence_required:
      - "design-note"
      - "spec-update"
    evidence_produced: []
    deviation_log: []
    change_scope:
      - ".ai-os/lanes/default/DESIGN.md"
      - ".ai-os/lanes/default/specs/example.spec.md"
  - id: TASK-AI-002
    title: "按已锁定设计完成实现与验证"
    milestone: M2
    status: todo
    owner: AI
    priority: P0
    wave: 2
    approval_required: false
    depends_on:
      - "TASK-AI-001"
    requirement_refs:
      - "REQ-001"
    acceptance_refs:
      - "AC-001"
    handoff_to: "[AI / human / external-agent]"
    context_refs:
      - ".ai-os/lanes/default/tasks.yaml"
      - ".ai-os/lanes/default/verification-matrix.yaml"
    expected_return:
      - "[code diff / test log / runtime evidence]"
    agent_run_review:
      execution_surface: "[local_foreground / cloud_background / external_pr_agent / human]"
      run_refs: []
      write_scope:
        owned:
          - "[file or module owned by this run]"
        out_of_scope:
          - "[file or module explicitly not owned]"
      progress_checkpoints:
        - "[plan accepted / diff produced / tests run / blocker surfaced / review requested]"
      return_packet:
        summary: "[what came back from the long-horizon run]"
        changed_files: []
        tests: []
        unresolved_risks: []
        follow_up_needed: []
      human_review_status: "pending"
    fact_state_review:
      observed:
        - "[test / lint / runtime result actually observed]"
      confirmed:
        - "[confirmed design / scope / acceptance source]"
      inferred: []
      unknown: []
    impact_tags:
      - "transport"
      - "mapping"
    evidence_required:
      - "build-log"
      - "test-log"
      - "runtime-check"
    evidence_produced: []
    deviation_log: []
    change_scope:
      - "[src path]"
      - "[test path]"
