# 本模板所有内容必须严格基于用户确认的需求基准生成，禁止擅自超出范围、脑补内容。
# v4 迁移：用 approval.required 替代 approval_required:，不得同时保留两个数据字段。
# evidence_produced 条目字段：id:、kind:、command:、exit_code:、git_sha:、environment:、
# observed_at:、artifact:、confidence:；仅记录真实证据，confidence 为 observed / inferred / unknown。
version: 5
baseline_id: "{{INITIAL_BASELINE_ID}}"
scope:
  mode: "change"
  focus: "example-lane"
  baseline_source: "lane MISSION.md"

milestones:
  - id: M1
    title: "Built and Verified"
    goal: "设计、实现、验证和交付证据已就绪"

tasks:
  - id: TASK-AI-001
    title: "按已锁定设计完成实现与验证"
    milestone: M1
    status: todo
    owner: AI
    priority: P1
    approval:
      required: false
      status: not-required
      decided_by: ""
      decided_at: ""
      baseline_id: "{{INITIAL_BASELINE_ID}}"
      approved_scope: []
      conditions: []
      evidence_ref: ""
    depends_on: []
    acceptance_refs:
      - "AC-001"
    evidence_required:
      - "build-log"
      - "test-log"
    evidence_produced: []
    delivery_state:
      code: unknown
      data: unknown
      runtime: unknown
    change_scope:
      - "[src path]"
      - "[test path]"
