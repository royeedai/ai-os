# 本模板所有内容必须严格基于用户确认的需求基准生成，禁止擅自超出范围、脑补内容。
version: 4
baseline_id: "{{INITIAL_BASELINE_ID}}"
scope:
  mode: "change"
  focus: "example-lane"
  baseline_source: "lane MISSION.md"

milestones:
  - id: M1
    title: "Design Locked"
    goal: "关键设计与逻辑已确认"
  - id: M2
    title: "Built and Verified"
    goal: "实现、验证和交付证据已就绪"

tasks:
  - id: TASK-AI-001
    title: "收敛当前 lane 的关键设计与契约"
    milestone: M1
    status: todo
    owner: AI
    priority: P1
    approval_required: false  # 布尔；high-risk 任务设 true 触发审批门
    depends_on: []
    acceptance_refs:
      - "AC-001"
    evidence_required:
      - "design-note"
    evidence_produced: []
    change_scope:
      - ".ai-os/lanes/default/DESIGN.md"
  - id: TASK-AI-002
    title: "按已锁定设计完成实现与验证"
    milestone: M2
    status: todo
    owner: AI
    priority: P0
    approval_required: false
    depends_on:
      - "TASK-AI-001"
    acceptance_refs:
      - "AC-001"
    evidence_required:
      - "build-log"
      - "test-log"
    evidence_produced: []
    change_scope:
      - "[src path]"
      - "[test path]"
