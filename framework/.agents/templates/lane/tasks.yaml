# 本模板所有内容必须严格基于用户确认的需求基准生成，禁止擅自超出范围、脑补内容。
# 里程碑标题描述待达成目标；fresh task 保持 todo、evidence_produced 为空、delivery_state 为 unknown。
version: 5
baseline_id: "{{INITIAL_BASELINE_ID}}"
scope:
  mode: "change"
  focus: "example-lane"
  baseline_source: "lane MISSION.md"

milestones:
  - id: M1
    title: "Design Locked"
    goal: "关键设计与逻辑已确认"
  - id: M2
    title: "Built and Verified"
    goal: "实现、验证和交付证据已就绪"

tasks:
  - id: TASK-AI-001
    title: "收敛当前 lane 的关键设计与契约"
    milestone: M1
    status: todo
    owner: AI
    priority: P1
    approval:
      required: false
      status: not-required
      decided_by: ""
      decided_at: ""
      baseline_id: "{{INITIAL_BASELINE_ID}}"
      approved_scope: []
      conditions: []
      evidence_ref: ""
    depends_on: []
    acceptance_refs:
      - "AC-001"
    evidence_required:
      # v4 design-note 语义映射为 canonical static evidence kind。
      - static
    evidence_produced: []
    delivery_state:
      code: unknown
      data: unknown
      runtime: unknown
    change_scope:
      - ".ai-os/lanes/default/DESIGN.md"
  - id: TASK-AI-002
    title: "按已锁定设计完成实现与验证"
    milestone: M2
    status: todo
    owner: AI
    priority: P0
    approval:
      required: false
      status: not-required
      decided_by: ""
      decided_at: ""
      baseline_id: "{{INITIAL_BASELINE_ID}}"
      approved_scope: []
      conditions: []
      evidence_ref: ""
    depends_on:
      - "TASK-AI-001"
    acceptance_refs:
      - "AC-001"
    evidence_required:
      # v4 build-log / test-log 语义映射为 canonical static / test evidence kinds。
      - static
      - test
    evidence_produced: []
    delivery_state:
      code: unknown
      data: unknown
      runtime: unknown
    change_scope:
      - "[src path]"
      - "[test path]"
