impact_rules:
  - when: "shared-layer-change"
    run:
      - "[project-native static check]"
      - "[targeted regression]"
  - when: "url-reverse-spec-intake"
    run:
      - "[visual parity check at 1440/768/390]"
      - "[interaction sweep: scroll/click/hover/time]"
      - "[Network/API observation review]"
      - "[backend behavior confidence review]"
      - "[evidence package redaction + confidence review]"
  - when: "agent-handoff-evidence-loop"
    run:
      - "[task handoff context review]"
      - "[expected return review]"
      - "[produced evidence review before done]"
  - when: "hallucination-guard"
    run:
      - "[fact_state_review observed / confirmed / inferred / unknown review]"
      - "[unknowns moved to pending confirmation or non-goals]"
      - "[doctor W077 before done / verified / shipped]"
  - when: "long-horizon-agent-run"
    run:
      - "[agent_run_review execution surface + run refs review]"
      - "[write_scope overlap review across background / parallel agents]"
      - "[return_packet + human_review_status before done / verified / shipped]"
      - "[doctor W078 before done / verified / shipped]"
  - when: "design-aware-component-first-ui"
    run:
      - "[UI source routing review: design-led / component-first / existing-style / hybrid]"
      - "[component library selection review: existing dependency before new library]"
      - "[fidelity level review: strict / practical / component-native]"
      - "[business logic and UI states review: validation / permissions / loading / empty / error / responsive]"
  - when: "product-design-optional-bridge"
    run:
      - "[design_input review: provider / capability_used / evidence_refs / fallback_path]"
      - "[Product Design evidence review when available: brief / selected visual option / prototype / design QA / share]"
      - "[no-plugin fallback review: figma / screenshot / url-reverse-spec / component-first / existing-style]"
      - "[native verification review: Product Design evidence does not replace project checks]"
  - when: "long-lived-maintenance-review"
    run:
      - "[maintenance_review drift_signals evidence review]"
      - "[refactor_trigger review: evidence-backed, not calendar-based]"
      - "[contract_impact review against memory.md architecture guardrails]"
      - "[native_checks review before done / verified / shipped]"
      - "[debt_disposition review: memory.md / verification-matrix.yaml / evals feedback when stable]"

failure_modes:
  - id: FM-001
    scenario: "[稳定失败模式]"
    expected: "[期望行为]"
    guard: "[测试 / smoke / review note]"
  - id: FM-URL-001
    scenario: "URL reverse-spec 只凭截图复刻，未记录 DOM / computed CSS / interaction / Network 证据"
    expected: "parity-map 和 spec 缺证据时不得进入实现"
    guard: "docs/reverse-spec-url-intake.md + design-pack/parity-map.md"
  - id: FM-URL-002
    scenario: "无 Network 证据的后端规则被写成 confirmed AC"
    expected: "该规则必须标为 inferred 或 unknown，并进入假设或待确认项"
    guard: "specs/*.spec.md backend behavior confidence review"
  - id: FM-URL-003
    scenario: "URL evidence package 记录了 trace / HAR / DOM / rawHtml / markdown / structured JSON，但未标注 confidence 或脱敏要求"
    expected: "证据包必须映射到 observed / inferred / unknown，并记录 secrets / PII 脱敏要求"
    guard: "design-pack/parity-map.md evidence package adaptation matrix"
  - id: FM-HANDOFF-001
    scenario: "task 交给 IDE/agent 执行，但缺 context_refs / expected_return 或 done 时缺 evidence_produced"
    expected: "任务不得只靠口头交接；必须记录上下文、期望返回物和实际证据"
    guard: "doctor W076 + tasks.yaml handoff/evidence loop review"
  - id: FM-HALLUCINATION-001
    scenario: "AI 把 inferred / unknown 内容包装成已确认事实并继续实现或收口"
    expected: "`inferred` 必须标假设，`unknown` 必须进入待确认或非目标；done / verified / shipped 任务不得保留未解决 inferred / unknown"
    guard: "doctor W077 + tasks.yaml fact_state_review"
  - id: FM-LONGRUN-001
    scenario: "后台 agent run 已启动但没有 run_refs，后续无法找到分支、PR、issue、外部任务 URL 或 session"
    expected: "delegated / background / parallel work 必须记录 agent_run_review.run_refs"
    guard: "doctor W078 + tasks.yaml agent_run_review.run_refs"
  - id: FM-LONGRUN-002
    scenario: "外部或后台 PR agent 返回 diff，但 human_review_status 仍是 pending 就被标记 done / verified / shipped"
    expected: "任务关闭前必须有 return_packet、evidence_produced 和 reviewed / accepted 的 human_review_status"
    guard: "doctor W078 + human review checklist"
  - id: FM-LONGRUN-003
    scenario: "委托时的 branch 与返回 diff 已经 drift，或并行 agent 修改了重叠 write_scope"
    expected: "write_scope 必须列 owned / out_of_scope，并在回收时检查 branch drift 和 scope overlap"
    guard: "tasks.yaml agent_run_review.write_scope + review note"
  - id: FM-LONGRUN-004
    scenario: "长时程 agent 声称完成但没有项目原生测试证据"
    expected: "return_packet.tests 和 evidence_produced 必须记录 native test / lint / doctor 证据"
    guard: "doctor W078 + W076"
  - id: FM-LONGRUN-005
    scenario: "外部 agent 使用网络、secret 或跨账号能力，但边界没有写清"
    expected: "write_scope 或 deviation_log 必须标出 network / secrets boundary；不清楚时不能关闭任务"
    guard: "agent_run_review.write_scope + risk review"
  - id: FM-UI-001
    scenario: "有设计稿时为了套组件明显偏离设计稿，或无设计稿时手搓一套与项目风格不一致的 UI"
    expected: "先记录 ui_source、component_library、fidelity_level；有设计稿以设计为目标，组件库作为优先实现路径；无设计稿以现有或栈匹配组件库为基线"
    guard: "DESIGN.md UI Source Routing + component library review"
  - id: FM-UI-002
    scenario: "为了组件库开发跳过字段、接口、权限、校验、loading / empty / error / responsive 等验收"
    expected: "组件优先只替代临时视觉设计，不替代业务逻辑、状态流转和项目原生验证"
    guard: "verification-matrix design-aware-component-first-ui impact rule"
  - id: FM-PD-001
    scenario: "把 Product Design 当成 AI-OS 硬依赖，导致无插件 IDE 无法交付 UI / prototype 任务"
    expected: "Product Design 只是可选设计证据 provider；无插件时必须记录 figma / screenshot / url-reverse-spec / component-first / existing-style fallback"
    guard: "DESIGN.md design_input + docs/interop/product-design.md"
  - id: FM-PD-002
    scenario: "Product Design prototype、design QA 或 share URL 替代了项目原生 build / lint / typecheck / test"
    expected: "Product Design 产物只作为 evidence_refs / evidence_produced；交付仍需项目原生静态校验证据"
    guard: "tasks.yaml evidence_required + native verification"
  - id: FM-MAINT-001
    scenario: "长期 AI 项目被要求按固定周期做一次大重构，但没有 drift_signals、contract_impact 或 native check 证据"
    expected: "不得把周期性大重构作为默认闭环；必须先登记 drift evidence，再开维护 CR 或 scoped refactor task"
    guard: "tasks.yaml maintenance_review + baseline-log CR + native verification"
  - id: FM-MAINT-002
    scenario: "多轮 AI 交付后出现重复返工、同型缺陷或架构漂移，但结果只留在聊天或总结里，没有回流 memory.md / verification-matrix.yaml / evals"
    expected: "稳定漂移信号必须进入 memory guardrail、verification guard 或 promoted eval；未达升格阈值也要进入 debt_disposition"
    guard: "maintenance_review.debt_disposition + stable failure mode rule"

guards:
  - "[evidence path or eval reference]"
