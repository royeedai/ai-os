impact_rules:
  - when: "cli"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "docs"
    run:
      - "npm test"
      - "npm run lint"
  - when: "examples"
    run:
      - "npm test"
  - when: "evals"
    run:
      - "npm test"

failure_modes:
  - id: FM-V1012-001
    scenario: "major 移除 CLI 子命令后旧入口无人守卫，叠加「未知首参 = 目标目录」默认路由，`create-ai-os upgrade` 静默创建 ./upgrade/ 并装入整套工件"
    expected: "已移除子命令命中显式守卫清单（REMOVED_SUBCOMMANDS）即报错并指向 install，不创建任何目录；合法目录名安装语义不变"
    guard: "test/install.test.js 'removed subcommands fail instead of installing into a directory'"
    acceptance_refs:
      - AC-001
  - id: FM-V1012-002
    scenario: "工件路径类型不匹配（file 工件实为目录）时 checkArtifact 漏检，后续语义检查 readFileSync 直接 EISDIR 裸崩"
    expected: "checkArtifact 用 isFile() 单点报 E022；语义检查只读常规文件，类型错误静默跳过不崩溃"
    guard: "test/doctor.test.js 'file artifact replaced by a directory returns E022'"
    acceptance_refs:
      - AC-002
  - id: FM-V1012-003
    scenario: "CR 的 AC 与实际落地分叉（v10.1.0 AC 写 DESIGN §9，落地模板为 §10）且未记 deviation_log，文档全部沿用错误锚点"
    expected: "文档与分发模板的节号锚点一致；测试断言到节号粒度而非仅字符串存在；AC 与落地不一致时当场回改或记 deviation"
    guard: "test/docs.test.js section-level anchor assertions（§9 = 验收标准、§10 = 反述确认门、docs 禁止再锚 §9）"
    acceptance_refs:
      - AC-003
  - id: FM-V1012-004
    scenario: "跨版本清理不彻底：maintainers guard 落点残留 upgrade、多处「AI-OS v9」读作框架版本、CHANGELOG 头部范围过时"
    expected: "活文档无已移除命令残留；版本化措辞仅保留能力引入标签与 schema 代际引用"
    guard: "发布前 rg 'AI-OS v9|install / upgrade' 核对 + npm test"
    acceptance_refs:
      - AC-004
  - id: FM-V1012-005
    scenario: "CHANGELOG 宣称的示例演示能力（Demonstrated in greenfield）实际未落地，示例只覆盖 MISSION 层反述"
    expected: "宣称的能力在示例中真实可见：greenfield 同时演示需求层（MISSION §2）与设计层（DESIGN §10）反述"
    guard: "test/docs.test.js greenfield restate assertion + 发布前人工核对 CHANGELOG 宣称"
    acceptance_refs:
      - AC-005
  - id: FM-V1012-006
    scenario: "dogfood lane 工件落后于当前交付或版本元数据未同步收口"
    expected: "lane live 工件指向当前 baseline CR；版本元数据 / CHANGELOG / maintainers / project-lead 同步到 10.1.2 后才关闭"
    guard: "baseline_id 在 MISSION / lane.toml / tasks 一致 + node bin/ai-os-doctor.js . W070 + npm test version assertions"
    acceptance_refs:
      - AC-006
      - AC-007

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "npm run lint"
