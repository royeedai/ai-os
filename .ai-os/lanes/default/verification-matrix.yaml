impact_rules:
  - when: "long-horizon-agent-reliability"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "activation-gate"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "hallucination-guard"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"

failure_modes:
  - id: FM-V960-001
    scenario: "后台 / 云端 / 外部 PR agent work 缺 branch、PR、issue、外部 task URL 或 session id，返回后无法定位原始运行"
    expected: "doctor W078 指出缺 `agent_run_review.run_refs`；task 不能关闭"
    guard: "test/doctor.test.js W078 missing run refs"
    acceptance_refs:
      - AC-002
      - AC-003
  - id: FM-V960-002
    scenario: "并行 agent 修改范围重叠，或外部 agent 越界改了 out-of-scope 文件"
    expected: "`agent_run_review.write_scope` 必须列 owned / out-of-scope，review 时对照 diff"
    guard: "test/docs.test.js long-horizon verification matrix + examples/background-agent-handoff.md"
    acceptance_refs:
      - AC-001
      - AC-004
  - id: FM-V960-003
    scenario: "long-horizon task 标记 done / verified / shipped，但没有 return_packet、项目原生 evidence 或 human review"
    expected: "doctor W078 指出缺 `return_packet` / `evidence_produced` / `human_review_status`"
    guard: "test/doctor.test.js W078 missing return packet / human review"
    acceptance_refs:
      - AC-002
      - AC-003
  - id: FM-V960-004
    scenario: "返回包里仍有 unresolved risks，但 task 被标记 verified"
    expected: "doctor W078 指出 unresolved risk at close"
    guard: "test/doctor.test.js W078 unresolved returned risk"
    acceptance_refs:
      - AC-003
  - id: FM-V960-005
    scenario: "local foreground task 因存在 `agent_run_review` placeholder 被 W078 误报"
    expected: "W078 只对明确 background / cloud / external / parallel execution 触发"
    guard: "test/doctor.test.js W078 local foreground bypass"
    acceptance_refs:
      - AC-002
  - id: FM-V960-006
    scenario: "文档把 v9.6 描述成 AI-OS runtime runner、MCP server、IDE hook、agent router 或 vendor adapter"
    expected: "docs tests 要求 README、spec、interop doc 和 product surface 保持 no runtime / no new CLI"
    guard: "test/docs.test.js long-horizon product boundary"
    acceptance_refs:
      - AC-005
  - id: FM-V951-001
    scenario: "用户只要求需求闲聊、方案讨论、代码解释或非仓库交付任务，但 agent 读取 lane 工件或写 `.ai-os/*`"
    expected: "AGENTS / skill / docs 明确 ordinary conversation 不进入 AI-OS artifact governance，docs tests 捕捉文案漂移"
    guard: "test/docs.test.js activation gate coverage"
    acceptance_refs:
      - AC-001
      - AC-005
  - id: FM-V95-001
    scenario: "任务进入 in_progress / done / verified / shipped，但缺 observed 或 confirmed 事实来源"
    expected: "doctor W077 在 --strict 下阻断，要求补 `fact_state_review`"
    guard: "test/doctor.test.js W077 missing fact-state review"
    acceptance_refs:
      - AC-006

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "npm run lint"
