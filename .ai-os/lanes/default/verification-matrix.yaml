impact_rules:
  - when: "hallucination-guard"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "release-product-surface-polish"
    run:
      - "node bin/create-ai-os.js --help"

failure_modes:
  - id: FM-V95-001
    scenario: "任务进入 in_progress / done / verified / shipped，但缺 observed 或 confirmed 事实来源"
    expected: "doctor W077 在 --strict 下阻断，要求补 `fact_state_review`"
    guard: "test/doctor.test.js W077 missing fact-state review"
    acceptance_refs:
      - AC-001
      - AC-002
  - id: FM-V95-002
    scenario: "任务标记 done / verified / shipped 时仍保留 unresolved `inferred`"
    expected: "doctor W077 指出该 task 的 inferred 未解决"
    guard: "test/doctor.test.js W077 unresolved inferred"
    acceptance_refs:
      - AC-002
      - AC-004
  - id: FM-V95-003
    scenario: "任务标记 done / verified / shipped 时仍保留 unresolved `unknown`"
    expected: "doctor W077 指出该 task 的 unknown 未解决"
    guard: "test/doctor.test.js W077 unresolved unknown"
    acceptance_refs:
      - AC-002
      - AC-004
  - id: FM-V95-004
    scenario: "公开文档把 Hallucination Guard 描述成外部 prompt pack、IDE hook 或 runtime detector"
    expected: "docs tests fail，要求改回 artifact governance 口径"
    guard: "test/docs.test.js hallucination guard product boundary"
    acceptance_refs:
      - AC-003
      - AC-005
  - id: FM-V95-005
    scenario: "版本、changelog、doctor semantic warning range 或 product surface 文案漂移"
    expected: "docs/install/shared/doctor tests fail"
    guard: "test/docs.test.js + test/install.test.js + test/shared.test.js"
    acceptance_refs:
      - AC-005

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "node bin/create-ai-os.js --help"
