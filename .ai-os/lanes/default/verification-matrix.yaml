impact_rules:
  - when: "consistency-optimization"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "docs"
    run:
      - "npm test"
      - "npm run lint"
  - when: "cli-wording"
    run:
      - "npm test"
      - "node bin/create-ai-os.js doctor . --json --strict"

failure_modes:
  - id: FM-V1011-001
    scenario: "interop 边缘文档声明的产品操作数 / 命令与现实矛盾（mcp-resources 仍写 3 operations + upgrade，与同文件 2 operations 自相矛盾）"
    expected: "全仓只有一个产品面真理源：2 primary operations（install / doctor）；upgrade 已在 v10.0.0 删除，边缘文档不得残留"
    guard: "test/docs.test.js mcp-resources 2-operation assertion"
    acceptance_refs:
      - AC-001
      - AC-004
  - id: FM-V1011-002
    scenario: "发布叙事里的 spec 版本号与实际 spec 头部不一致（CHANGELOG v10.1.0 写 v2.1，实为 v2.2，复制了上一版号）"
    expected: "CHANGELOG 的 spec 版本锚点与 docs/constitution-spec.md 头部 / maintainers / 测试断言一致"
    guard: "docs/constitution-spec.md Version 2.2 + test/docs.test.js spec assertion + 发布前人工核对 CHANGELOG"
    acceptance_refs:
      - AC-001
      - AC-005
  - id: FM-V1011-003
    scenario: "跨版本去版本化不彻底，user-facing 输出 / 注释残留读作框架版本的旧 v9（doctor 报告、README、bin 文件头）"
    expected: "user-facing 输出与文件头注释不含读作框架版本的 v9；schema 代际引用与 AI-OS v9 managed 段头按设计保留"
    guard: "test/doctor.test.js 'All checks passed' prefix assertion + 发布前 grep 核对 user-facing 字样"
    acceptance_refs:
      - AC-002
  - id: FM-V1011-004
    scenario: "dogfood lane 的 DESIGN / tasks / verification-matrix 落后于 MISSION / baseline-log 的当前基线，造成自托管工件内部漂移"
    expected: "lane live 工件随每次交付推进并指向当前 baseline CR；历史由 baseline-log 永久保留"
    guard: "baseline_id 在 MISSION / lane.toml / tasks 一致 + node bin/ai-os-doctor.js . W070"
    acceptance_refs:
      - AC-003
  - id: FM-V1011-005
    scenario: "以一致性修复之名顺手扩张产品面（新增 CLI / flag / doctor warning code / 工件类别）"
    expected: "保持 2 primary operations、零运行时依赖、AGENTS.md 150 行、schema 9、constitution-spec v2.2，不新增任何产品面"
    guard: "product surface tests（two primary operations + no runtime deps）+ npm run lint"
    acceptance_refs:
      - AC-006
  - id: FM-V1011-006
    scenario: "文案与工件已改，但 VERSION / package metadata / 测试断言 / CHANGELOG / maintainers / project-lead 没有同步收口"
    expected: "版本同步到 10.1.1，CHANGELOG / maintainers / project-lead 记录 v10.1.1，npm test / lint / strict doctor 全部通过后才关闭"
    guard: "VERSION + package.json + package-lock.json + npm test version assertions + npm run lint + doctor --strict"
    acceptance_refs:
      - AC-005
      - AC-007

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "npm run lint"
