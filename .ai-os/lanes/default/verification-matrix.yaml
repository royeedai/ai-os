impact_rules:
  - when: "design-aware-component-first-ui"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "long-horizon-agent-reliability"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "activation-gate"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"

failure_modes:
  - id: FM-V990-001
    scenario: "有设计稿时 agent 认为不能用组件库，于是手搓按钮、表格、表单、弹窗等标准元素，导致维护性和项目一致性下降"
    expected: "设计稿作为目标效果，组件库作为优先实现路径；仅组件无法满足的品牌视觉、特殊布局或强还原要求才定制"
    guard: "test/docs.test.js design-aware component-first UI routing"
    acceptance_refs:
      - AC-001
      - AC-004
  - id: FM-V990-002
    scenario: "无设计稿时 agent 直接自由设计后台 / PC / 移动业务页，未选择项目现有或栈匹配组件库"
    expected: "后台、PC 业务系统、移动业务端默认 component-first；先检查 package.json / existing style，再按 Vue / React / uni-app / Taro / 小程序选择国内熟悉组件库"
    guard: "test/docs.test.js component library defaults"
    acceptance_refs:
      - AC-001
      - AC-002
      - AC-004
  - id: FM-V990-003
    scenario: "老项目已有 Element Plus / Ant Design / Vant / TDesign 等组件库，但 agent 因个人偏好引入第二套 UI 库"
    expected: "已有组件库优先；不得混用第二套，除非用户明确要求或项目既有架构已经混用"
    guard: "README + skill wrapper existing dependency priority assertion"
    acceptance_refs:
      - AC-004
      - AC-005
  - id: FM-V990-004
    scenario: "组件库优先被误解成无需确认业务逻辑，页面缺权限拒绝、空数据、loading、错误、表单校验或响应式验收"
    expected: "component-first 只替代临时视觉设计；业务逻辑、接口、权限、状态、异常和项目原生验证仍必须进入 acceptance"
    guard: "test/docs.test.js business state coverage"
    acceptance_refs:
      - AC-001
      - AC-003
  - id: FM-V990-005
    scenario: "C 端首页、活动页、品牌页或强视觉页面在无设计稿时被默认做成普通组件库拼装页"
    expected: "强视觉 / 品牌 / 营销场景需要先确认视觉风险、风格基线或设计要求；不得套用后台 component-native 默认"
    guard: "docs/artifacts.md consumer visual risk clause"
    acceptance_refs:
      - AC-001
      - AC-004
  - id: FM-V990-006
    scenario: "文档和模板已改，但 VERSION / package metadata / changelog / self-hosted lane 或原生验证没有收口"
    expected: "版本 metadata 同步到 9.9.0，CHANGELOG 记录 v9.9，npm test / lint / strict doctor 全部通过后才关闭"
    guard: "VERSION + package.json + CHANGELOG.md + npm test + npm run lint + doctor --strict"
    acceptance_refs:
      - AC-006

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "npm run lint"
