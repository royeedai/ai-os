impact_rules:
  - when: "product-design-optional-bridge"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "design-aware-component-first-ui"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "long-horizon-agent-reliability"
    run:
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"

failure_modes:
  - id: FM-PD-001
    scenario: "AI-OS 文档把 Product Design 写成 Codex / 插件环境的硬依赖，导致 Cursor、Claude Code 或无插件 IDE 不能按同一工件交付 UI"
    expected: "Product Design 只能是可选设计证据 provider；无插件场景必须通过 Figma、截图、URL reverse-spec、component-first 或 existing-style fallback 使用同一 design_input 字段"
    guard: "test/docs.test.js Product Design optional bridge"
    acceptance_refs:
      - AC-001
      - AC-002
      - AC-005
  - id: FM-PD-002
    scenario: "Product Design 的 prototype、image-to-code 或 share URL 被当作 AI-OS 原生验证，跳过项目 build / lint / typecheck / doctor"
    expected: "Product Design 产物只进入 evidence_refs 或 evidence_produced；任务收口仍必须有项目原生静态校验证据"
    guard: "test/docs.test.js Product Design native verification boundary"
    acceptance_refs:
      - AC-003
      - AC-004
      - AC-006
  - id: FM-PD-003
    scenario: "有 Product Design brief 但没有视觉目标或用户选定方案，就直接进入 prototype / image-to-code 实现"
    expected: "brief 只锁目标；没有 URL、截图、Figma、mockup 或已选 visual option 时必须先完成 ideation/选择或走 fallback"
    guard: "docs/interop/product-design.md brief-gate mapping"
    acceptance_refs:
      - AC-001
      - AC-004
  - id: FM-PD-004
    scenario: "无 Product Design 时 agent 不记录设计输入来源，导致后续 IDE 不知道是截图、Figma、URL、现有代码还是人工 brief"
    expected: "DESIGN.md 必须记录 design_input.provider、capability_used、evidence_refs 和 fallback_path，其他 IDE 只依赖这些通用字段"
    guard: "framework/.agents/templates/lane/DESIGN.md design_input fields"
    acceptance_refs:
      - AC-002
      - AC-005
  - id: FM-PD-005
    scenario: "Product Design 输出与项目已有组件库或 UI source routing 冲突，但没有记录 fidelity / component selection trade-off"
    expected: "DESIGN.md 保留 ui_source、component_library、fidelity_level、custom_required 和 design_input；偏离进入 deviation_log 或 CR"
    guard: "DESIGN.md UI Source Routing + tasks.yaml deviation_log"
    acceptance_refs:
      - AC-002
      - AC-003
  - id: FM-PD-006
    scenario: "文档和模板已改，但 VERSION / package metadata / changelog / self-hosted lane 或原生验证没有收口"
    expected: "版本 metadata 同步到 10.2.0，CHANGELOG 记录 v10.2，npm test / lint / strict doctor 全部通过后才关闭"
    guard: "VERSION + package.json + CHANGELOG.md + npm test + npm run lint + doctor --strict"
    acceptance_refs:
      - AC-006

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "npm run lint"
