impact_rules:
  - when: "boundary-evolution-policy"
    run:
      - "AGENTS / skill boundary evolution behavior review"
      - "README boundary evolution policy review"
      - "docs/artifacts.md boundary layer review"
      - "docs/constitution-spec.md v2.6 review"
      - "docs/maintainers.md boundary decision checklist review"
      - "docs/interop/standards-map.md adapter boundary review"
      - "version metadata parity check"
      - "npm test"
      - "npm run lint"
      - "node bin/create-ai-os.js doctor . --json --strict"
  - when: "controlled-extension-review"
    run:
      - "CR / evidence gate exists before extension"
      - "doctor warning candidate is deterministic and structural"
      - "CLI candidate cannot be covered by install / doctor"
      - "adapter candidate is optional, thin, and removable"
      - "artifact category candidate proves existing 12 categories cannot express the need"
  - when: "product-surface-boundary"
    run:
      - "no new CLI command in this release"
      - "no new runtime / agent runner in this release"
      - "no new doctor warning code in this release"
      - "no adapter implementation in this release"
      - "no 13th artifact category in this release"

failure_modes:
  - id: FM-BOUNDARY-001
    scenario: "AI-OS boundary docs say never add doctor / CLI / artifact category, blocking future evidence-backed evolution"
    expected: "Docs say default no expansion, but controlled extension can pass boundary review with CR, evidence, tests, and guards"
    guard: "test/docs.test.js boundary evolution assertions"
    acceptance_refs:
      - AC-001
      - AC-003
  - id: FM-BOUNDARY-002
    scenario: "Boundary evolution policy is used to justify adding a runtime, scheduler, model router, auto-release platform, or telemetry"
    expected: "Forbidden surfaces remain permanently blocked from AI-OS core"
    guard: "README + artifacts + skill forbidden-surface assertions"
    acceptance_refs:
      - AC-001
      - AC-004
  - id: FM-BOUNDARY-003
    scenario: "A new doctor warning, CLI subcommand, adapter, or artifact category is proposed without entry criteria"
    expected: "Maintainer checklist requires deterministic signal / high-frequency need / optional thin adapter / proof existing artifacts cannot express the need"
    guard: "docs/maintainers.md Boundary Decision Checklist"
    acceptance_refs:
      - AC-002
  - id: FM-BOUNDARY-004
    scenario: "版本 bump 到 10.5.0 但 package-lock、docs pin、install tests 或 self-hosted framework metadata 仍停在 10.4.0"
    expected: "VERSION、package.json、package-lock、docs pin、tests 和 self-hosted framework metadata 一致"
    guard: "test/docs.test.js + test/install.test.js + test/doctor.test.js + test/shared.test.js"
    acceptance_refs:
      - AC-005
  - id: FM-BOUNDARY-005
    scenario: "文档和测试更新后未运行项目原生校验就声明完成"
    expected: "必须记录 npm test、npm run lint、strict doctor 结果"
    guard: "tasks.yaml evidence_required + final verification"
    acceptance_refs:
      - AC-006

guards:
  - "test/docs.test.js"
  - "test/install.test.js"
  - "test/doctor.test.js"
  - "test/shared.test.js"
  - "node bin/create-ai-os.js doctor . --json --strict"
  - "npm run lint"
